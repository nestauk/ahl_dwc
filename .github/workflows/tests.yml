name: Tests

# Build the C++ extension and run the suite across platforms and Python
# versions. Python 3.10–3.14 are driven by [tool.tox] (tox-uv); the OS matrix
# is the GitHub dimension. The Linux legs guard the GCC/libstdc++ build.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.10–3.14
        run: uv python install 3.10 3.11 3.12 3.13 3.14

      - name: Run tox (py3.10–3.14)
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: uvx --with tox-uv tox run
