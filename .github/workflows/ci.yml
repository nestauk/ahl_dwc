name: CI

# Lint and test on every push and pull request. The test job builds the C++
# extension (scikit-build-core + pybind11) and runs pytest on both Linux (GCC)
# and macOS (Clang) — the Linux leg also guards against the GCC/libstdc++
# compilation regression fixed in #7.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # ruff is pure-Python, so lint without building the extension. Pinned to
      # match .pre-commit-config.yaml.
      - name: ruff check
        run: uvx ruff@0.14.10 check .
      - name: ruff format --check
        run: uvx ruff@0.14.10 format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # `uv run` builds the extension via scikit-build-core, then runs the suite.
      - name: Run tests
        run: uv run pytest -q
