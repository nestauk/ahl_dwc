repos:
  - repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    rev: v0.9.0
    hooks:
      - id: pre-commit-update
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^.cookiecutter/config
      - id: trailing-whitespace
      - id: check-toml
      - id: check-yaml
        exclude: "docs/mkdocs.yml"
      - id: no-commit-to-branch
        args: ["-b", dev, "-b", main]
        pass_filenames: false
  - repo: https://github.com/nestauk/pre-commit-hooks
    rev: v1.2.0
    hooks:
      - id: nbstripout-preserve-timestamp
      - id: jupytext-enforce-pairing
      - id: jupytext-smart-sync
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-format
      - id: ruff-check
  # Only the sources we own; the rest of src/ is byte-identical to upstream
  # INSP-RH/bw. Pin must match .github/workflows/format.yml.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        files: ^src/(shim\.hpp|bindings\.cpp)$
  - repo: https://github.com/prettier/pre-commit
    rev: v2.1.2
    hooks:
      - id: prettier
