[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build.verbose = true
logging.level = "INFO"

[project]
name = "ahl_dwc"
authors = [{ name = "Harry Wilde", email = "harry.wilde@nesta.org.uk" }]
version = "0.1.0"
description = "A Python wrapper for the R `bw` package's Hall model C++ implementation"
requires-python = ">=3.8"
readme = "README.md"
license = "MIT"
dependencies = ["numpy>=1.24.4", "polars>=1.8.2"]

[project.urls]
repository = "https://github.com/nestauk/ahl_dwc"
issues = "https://github.com/nestauk/ahl_dwc/issues"

[dependency-groups]
dev = [
    "ipykernel",
    "jupytext",
    "nbstripout",
    "ruff",
    "pre-commit",
    "matplotlib>=3.7.5",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear: Likely bugs
    "C",   # flake8-comprehensions and mccabe complexity
    "E",   # pycodestyle: Errors (default)
    "F",   # pyflakes: Linter
    "I",   # isort
    "N",   # pep8-naming: Naming conventions
    "W",   # pycodestyle: Warnings (default)
]

[tool.ruff.lint.isort]
known-first-party = ["ahl_dwc"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402", "D104"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
